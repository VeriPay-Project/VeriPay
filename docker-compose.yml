services:
  ollama:
    image: ollama/ollama:latest
    container_name: veripay-ollama
    environment:
      OLLAMA_KEEP_ALIVE: "12h"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_LOAD_TIMEOUT: "10m"
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  ollama_init:
    image: ollama/ollama:latest
    container_name: veripay-ollama-init
    entrypoint: ["/bin/sh", "/init_ollama_model.sh"]
    environment:
      OLLAMA_HOST: "http://ollama:11434"
      OLLAMA_MODEL: "qwen2.5:0.5b"
      OLLAMA_WARMUP_PROMPT: "Extract nothing. Respond with only {\"ok\":true}."
    volumes:
      - ./backend/scripts/init_ollama_model.sh:/init_ollama_model.sh:ro
    depends_on:
      ollama:
        condition: service_healthy

  backend:
    image: veripay-aryan-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: veripay-backend
    env_file:
      - backend/.env
    environment:
      MODEL_WARMUP_ENABLED: "true"
      OLLAMA_URL: "http://ollama:11434/api/generate"
      OLLAMA_MODEL: "qwen2.5:0.5b"
      OLLAMA_TIMEOUT: "18"
      OLLAMA_KEEP_ALIVE: "12h"
      OLLAMA_NUM_CTX: "1536"
      OLLAMA_NUM_THREAD: "12"
      OLLAMA_MAX_RETRIES: "0"
      OLLAMA_MAX_TEXT_CHARS: "2200"
    working_dir: /app/backend
    # Development bind mounts so backend code and trained models are live.
    volumes:
      - ./backend:/app/backend
      - ./ai_pipeline:/app/ai_pipeline
      - ./test_pdfs:/app/test_pdfs
      - ./SuperviseTraining:/app/SuperviseTraining
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
      ollama_init:
        condition: service_completed_successfully
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: veripay-aryan-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: veripay-frontend
    working_dir: /app
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm run dev

volumes:
  frontend_node_modules:
  ollama_data:
