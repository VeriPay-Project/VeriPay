services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: veripay-backend
    env_file:
      - backend/.env
    working_dir: /app/backend
    volumes:
      - ./backend:/app/backend
      - ./ai_pipeline:/app/ai_pipeline
      - ./test_pdfs:/app/test_pdfs
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_started
      ollama_init:
        condition: service_completed_successfully
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: veripay-frontend
    working_dir: /app
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"

  ollama:
    image: ollama/ollama:latest
    container_name: veripay_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  ollama_init:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "/app/backend/scripts/init_ollama_model.sh"]
    volumes:
      - ollama_data:/root/.ollama
      - .:/app

volumes:
  frontend_node_modules:
  ollama_data:
